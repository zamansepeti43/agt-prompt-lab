name: Analyze prompts.chat dataset

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run dataset analysis
        run: python3 scripts/analyze-prompts-chat.py
      - name: Commit analysis report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/prompt-analysis.json reports/prompt-analysis.md
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "chore: update prompts.chat analysis"
            git push
          fi
