name: Analyze prompts.chat dataset

on:
  push:
    branches: [main]
    paths-ignore:
      - "reports/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Excel dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir openpyxl
      - name: Run dataset analysis and build Excel
        run: python3 scripts/analyze-prompts-chat.py
      - name: Commit analysis report and Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/prompt-analysis.json reports/prompt-analysis.md reports/prompts-chat-prompt-katalogu.xlsx
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "chore: update prompts.chat analysis and Excel catalog"
            git push
          fi

# build real Excel from synced prompts.chat source
